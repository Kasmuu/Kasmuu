<rect width="1000" height="600" rx="24" fill="#0B0B0F"/><rect width="1000" height="600" rx="24" fill="url(#grid)"/><circle cx="220" cy="140" r="120" fill="#D7263D" opacity=".6" filter="url(#b2)"><animate attributeName="cx" values="220;420;220" dur="11s" repeatCount="indefinite"/></circle><circle cx="780" cy="470" r="120" fill="#FFD23F" opacity=".45" filter="url(#b2)"><animate attributeName="cx" values="780;560;780" dur="13s" repeatCount="indefinite"/></circle><circle cx="800" cy="130" r="100" fill="#2DE2E6" opacity=".35" filter="url(#b2)"><animate attributeName="cy" values="130;300;130" dur="10s" repeatCount="indefinite"/></circle><rect x="100" y="64" width="800" height="478" rx="30" fill="url(#glass)" stroke="url(#rim)" stroke-width="2.5" filter="url(#sh)"/><rect x="100" y="64" width="800" height="478" rx="30" fill="url(#holo)"/><g clip-path="url(#card)"><rect x="-260" y="40" width="160" height="540" fill="url(#sheen)" transform="skewX(-18)"><animate attributeName="x" values="-260;1100" dur="5.5s" repeatCount="indefinite"/></rect></g><line x1="100" y1="104" x2="900" y2="104" stroke="#F4E3C8" stroke-opacity=".3"/><circle cx="136" cy="84" r="6" fill="#D7263D"/><circle cx="158" cy="84" r="6" fill="#FFD23F"/><circle cx="180" cy="84" r="6" fill="#2DE2E6"/><text x="860" y="89" text-anchor="end" font-family="'Courier New', Courier, monospace" font-size="13" fill="#F4E3C8" fill-opacity=".7">about_me.exe</text><text x="144" y="166" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="44" fill="#F4E3C8">Hello, I&#8217;m Kashmira.</text><text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#F4E3C8" fill-opacity=".92"><tspan x="144" y="216">I'm an aspiring AI/ML engineer from Kathmandu, Nepal, and a DataCamp</tspan><tspan x="144" y="243">Certified Professional Data Scientist. I build end-to-end solutions: ETL</tspan><tspan x="144" y="270">pipelines, predictive models, SQL databases, interactive dashboards and</tspan><tspan x="144" y="297">automation, turning real-world problems into data-driven applications. My</tspan><tspan x="144" y="324">design background means I care about models that perform and dashboards</tspan><tspan x="144" y="351">people actually enjoy using.</tspan></text><text x="144" y="412" font-family="'Courier New', Courier, monospace" font-size="15" fill="#F4E3C8"><tspan fill="#FFD23F" font-weight="700">NOW&#160;&#160;&#160;&#160;&#160;&#160;</tspan>&#9656; Creative Lead &amp; Data Analysis Contributor @ Nimbus</text><text x="144" y="442" font-family="'Courier New', Courier, monospace" font-size="15" fill="#F4E3C8"><tspan fill="#FFD23F" font-weight="700">LEARNING&#160;</tspan>&#9656; Deeper ML, deployment, BCA @ Thames Intl. College</text><text x="144" y="472" font-family="'Courier New', Courier, monospace" font-size="15" fill="#F4E3C8"><tspan fill="#FFD23F" font-weight="700">OPEN&#160;TO&#160;&#160;</tspan>&#9656; AI/ML, analytics &amp; automation work, internships</text><text x="144" y="502" font-family="'Courier New', Courier, monospace" font-size="15" fill="#F4E3C8"><tspan fill="#FFD23F" font-weight="700">ASK&#160;ME&#160;&#160;&#160;</tspan>&#9656; Python, SQL, Power BI, n8n, Streamlit</text><rect x="250" y="44" width="110" height="26" fill="#FFD23F" opacity=".85" transform="rotate(-5 305 57)"/><rect x="650" y="44" width="110" height="26" fill="#FF8FA3" opacity=".85" transform="rotate(4 705 57)"/><g transform="translate(96,92) rotate(-12)" filter="url(#sh)"><g><animateTransform attributeName="transform" type="rotate" values="-3.5 0 0;3.5 0 0;-3.5 0 0" dur="4s" begin="0s" repeatCount="indefinite"/><circle r="46" fill="#FFF8EC"/><circle r="40" fill="#D7263D"/><circle r="33" fill="none" stroke="#F4E3C8" stroke-opacity=".35" stroke-dasharray="3 4"/><text y="17" text-anchor="middle" font-size="50" font-family="Helvetica, Arial, sans-serif" font-weight="700" fill="#F4E3C8">&#9822;</text></g></g><g filter="url(#sh)"><line x1="96" y1="40" x2="81.0" y2="81.3" stroke="#cfd3dc" stroke-